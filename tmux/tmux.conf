set-option -g prefix C-space

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Focus events (lets editors/plugins track terminal focus)
set -g focus-events on

# Keys
bind -n S-Enter send-keys Escape "[13;2u"
bind C-l send-keys 'C-l'

# Windows & panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

# Resize panes
bind-key -r "H" resize-pane -L "5"
bind-key -r "J" resize-pane -D "5"
bind-key -r "K" resize-pane -U "5"
bind-key -r "L" resize-pane -R "5"

# Swap windows
bind-key -r "<" swap-window -t -1
bind-key -r ">" swap-window -t +1

# New window in current path
bind-key "C" new-window -c "#{pane_current_path}"

# Status bar (status-left/right are set by tokyo-night-tmux)
set -g status-position bottom

# +--------------------+
# | Plugins            |
# +--------------------+

set-environment -g TMUX_PLUGIN_PATH "$HOME/.dotfiles/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Must stay ahead of tmux-continuum: the theme overwrites status-right, and
# continuum prepends its auto-save hook to whatever it finds there.
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @tokyo-night-tmux_theme 'night'
# Set explicitly: the widgets read this unconditionally and warn when unset
set -g @tokyo-night-tmux_transparent 0
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_battery_widget 1
set -g @tokyo-night-tmux_show_hostname 1

# Restore the last saved environment when the server starts
set -g @continuum-restore 'on'

run "$HOME/.dotfiles/tmux/plugins/tpm/tpm"
